    # IG Harness（deploy/vps/deploy.sh が sakuraent.conf の x-harness-admin の直前へ挿入する）
    location = /ig-harness-admin { return 301 /ig-harness-admin/; }
    location /ig-harness-admin/ {
        alias /opt/ig-harness/apps/web/out/;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ ^/ig-harness-admin/(.+) {
        alias /opt/ig-harness/apps/web/out/;
        try_files /$1 /$1.html /index.html =404;
    }

    location /ig-harness/ {
        proxy_pass http://127.0.0.1:8799/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 動画（最大100MB）を base64 の JSON で受けると約133MB になる
        client_max_body_size 150m;
        proxy_read_timeout 120s;
    }

